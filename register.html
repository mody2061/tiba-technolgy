<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | Thebes Technological University</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #7b1e2b;
    --maroon-dark: #561520;
    --gold: #b58a2e;
    --ink: #1f1f1f;
    --muted: #6b6b6b;
    --paper: #faf8f5;
    --line: #ddd6cc;
    --error: #b3261e;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .side {
    background: var(--maroon);
    color: #fff;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 56px;
  }
  .side::before {
    content: "";
    position: absolute;
    top: 50%; left: -8%;
    width: 70%; aspect-ratio: 1;
    background: var(--gold);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
    transform: translateY(-62%);
    opacity: .92;
  }
  .side::after {
    content: "";
    position: absolute;
    top: 50%; left: 6%;
    width: 52%; aspect-ratio: 1;
    background: var(--maroon-dark);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
    transform: translateY(-62%);
  }
  .side h2, .side p { position: relative; z-index: 1; }
  .side h2 { font-size: 2rem; line-height: 1.25; font-weight: 700; max-width: 14ch; }
  .side p { margin-top: 10px; color: #f0dede; max-width: 34ch; }
  main { display: flex; align-items: center; justify-content: center; padding: 32px 24px; }
  .card { width: 100%; max-width: 400px; }
  .logo { width: 180px; max-width: 60%; display: block; margin: 0 auto 4px; mix-blend-mode: multiply; }
  h1 { font-size: 1.5rem; font-weight: 700; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 4px 0 24px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  .input-wrap { position: relative; }
  input[type="text"], input[type="email"], input[type="password"], select {
    width: 100%;
    font: inherit;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 1px;
  }
  [aria-invalid="true"] { border-color: var(--error); }
  .input-wrap input { padding-right: 64px; }
  .toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--maroon); font: inherit; font-weight: 600;
    padding: 6px 8px; cursor: pointer;
  }
  .err { color: var(--error); font-size: .875rem; margin-top: 4px; min-height: 1.2em; }
  .terms { display: flex; align-items: flex-start; gap: 8px; font-size: .9rem; margin: 4px 0 2px; }
  .terms label { font-weight: 400; margin: 0; }
  .submit {
    width: 100%;
    font: inherit; font-weight: 700;
    padding: 13px;
    border: 0; border-radius: 6px;
    background: var(--maroon); color: #fff;
    cursor: pointer;
    margin-top: 10px;
  }
  .submit:hover { background: var(--maroon-dark); }
  .submit:disabled { opacity: .6; cursor: wait; }
  .form-msg { margin-top: 14px; text-align: center; font-size: .9rem; min-height: 1.3em; }
  .form-msg.error { color: var(--error); }
  .form-msg.ok { color: #2d6a3e; }
  .back { display: block; text-align: center; margin-top: 8px; color: var(--maroon); font-weight: 600; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .foot { margin-top: 24px; text-align: center; font-size: .8rem; color: var(--muted); }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; }
    .side { display: none; }
  }
</style>
</head>
<body>

<aside class="side" aria-hidden="true">
  <h2>جامعة طيبة التكنولوجية</h2>
  <p>Create your student account to reach courses, grades, and university services.</p>
</aside>

<main>
  <div class="card">
    <img class="logo" src="ttu-logo.jpg" alt="Thebes Technological University">
    <h1>Create account</h1>
    <p class="sub">إنشاء حساب جديد</p>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" autocomplete="name" required
               placeholder="Enter Your Name">

        <div class="err" id="nameErr" role="alert"></div>
      </div>

      <div class="field">
        <label for="uid">National ID</label>
        <input type="text" id="uid" maxlength="14" pattern="[0-9]{14}" inputmode="numeric" autocomplete="off" placeholder="Enter ID" required>
        <div class="err" id="uidErr" role="alert"></div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required placeholder="Enter Email" required
>
        <div class="err" id="emailErr" role="alert"></div>
      </div>

      <div class="field">
        <label for="faculty">Faculty</label>
        <select id="faculty" required>
          <option value="">Choose your faculty</option>
          <option>صناعات خشبية</option>
          
        </select>
        <div class="err" id="facultyErr" role="alert"></div>
      </div>

      <div class="field">
        <label for="pw">Password</label>
        <div class="input-wrap">
          <input type="password" id="pw" autocomplete="new-password" required
                 placeholder="Enter Password"
>
          <button type="button" class="toggle" data-target="pw" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <div class="err" id="pwErr" role="alert"></div>
      </div>

      <div class="field">
        <label for="pw2">Confirm password</label>
        <div class="input-wrap">
          <input type="password" id="pw2" autocomplete="new-password" required
                 placeholder="Enter Password" 
>
          <button type="button" class="toggle" data-target="pw2" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <div class="err" id="pw2Err" role="alert"></div>
      </div>

      <div class="terms">
        <input type="checkbox" id="agree">
        <label for="agree">I agree to the university's terms of use.</label>
      </div>
      <div class="err" id="agreeErr" role="alert"></div>

      <button class="submit" id="submitBtn" type="submit">Create account</button>
      <div class="form-msg" id="formMsg" role="status"></div>
      <a class="back" href="login.html">Already registered? Sign in</a>
    </form>

    <p class="foot">&copy; Thebes Technological University</p>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const fields = ['name', 'uid', 'email', 'faculty', 'pw', 'pw2', 'agree'];

  function setError(id, text) {
    $(id + 'Err').textContent = text;
    $(id).setAttribute('aria-invalid', text ? 'true' : 'false');
  }
  fields.forEach(id => $(id).addEventListener('input', () => setError(id, '')));

  document.querySelectorAll('.toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = $(btn.dataset.target);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      btn.setAttribute('aria-pressed', String(show));
    });
  });

  $('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('formMsg');
    msg.textContent = '';
    msg.className = 'form-msg';

    const v = {
      name: $('name').value.trim(),
      uid: $('uid').value.trim(),
      email: $('email').value.trim(),
      faculty: $('faculty').value,
      pw: $('pw').value,
      pw2: $('pw2').value
    };
    let ok = true;
    const fail = (id, text) => { setError(id, text); ok = false; };

    if (v.name.length < 3) fail('name', 'Enter your full name.');
    if (!/^\d{14}$/.test(v.uid)) fail('uid', 'Your ID must be exactly 14 digits.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) fail('email', 'Enter a valid email address.');
    if (!v.faculty) fail('faculty', 'Choose your faculty.');
    if (v.pw.length < 8) fail('pw', 'Password must be at least 8 characters.');
    else if (!/\d/.test(v.pw) || !/[A-Za-z]/.test(v.pw)) fail('pw', 'Use both letters and numbers.');
    if (v.pw2 !== v.pw) fail('pw2', 'Passwords do not match.');
    if (!$('agree').checked) fail('agree', 'Accept the terms to continue.');
    if (!ok) return;

    const btn = $('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      const res = await fetch('register.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: v.name, id: v.uid, email: v.email, faculty: v.faculty, password: v.pw })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Could not create the account.');
      msg.textContent = 'Account created! Redirecting to sign in...';
      msg.classList.add('ok');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } catch (err) {
      msg.textContent = err instanceof TypeError ? 'Cannot reach the server. Open this page through Laragon (http://localhost/...).' : (err.message || 'Could not create the account. Try again.');
      msg.classList.add('error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
  });
  // University ID: numbers only, up to 14 digits
  const uidBox = document.getElementById('uid');
  const arabicDigits = '\u0660\u0661\u0662\u0663\u0664\u0665\u0666\u0667\u0668\u0669';
  // Block letters and symbols the moment they are typed
  uidBox.addEventListener('beforeinput', (e) => {
    if (e.data && /[^0-9\u0660-\u0669]/.test(e.data)) e.preventDefault();
  });
  // Clean pasted text, turn Arabic digits into 0-9, and stop at 14
  uidBox.addEventListener('input', (e) => {
    e.target.value = e.target.value
      .replace(/[\u0660-\u0669]/g, d => arabicDigits.indexOf(d))
      .replace(/\D/g, '')
      .slice(0, 14);
  });
  uidBox.addEventListener('drop', (e) => e.preventDefault());
</script>
</body>
</html>
